server:
  port: 8084

spring:
  application:
    name: servico-service
  datasource:
    url: ${SERVICO_DB_URL:jdbc:postgresql://localhost:5432/servico_db}
    driver-class-name: org.postgresql.Driver
    username: ${SERVICO_DB_USERNAME:naildesigner}
    password: ${SERVICO_DB_PASSWORD:naildesigner}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret:
    key: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
    br.com.naildesigner.servico_service.config.JwtAuthFilter: TRACE
    br.com.naildesigner.servico_service.services.JwtService: TRACE
    org.springframework.web: DEBUG
