server.port=8083
spring.application.name=agendamento-service-AgendeNail

spring.datasource.url=${AGENDAMENTO_DB_URL:jdbc:postgresql://localhost:5432/agendamento_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${AGENDAMENTO_DB_USERNAME:naildesigner}
spring.datasource.password=${AGENDAMENTO_DB_PASSWORD:naildesigner}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret.key=${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

messaging.rabbitmq.exchange=email.exchange
messaging.rabbitmq.routing-key=email.routing.key
messaging.rabbitmq.queue=email.queue
messaging.email.fallback-enabled=false
